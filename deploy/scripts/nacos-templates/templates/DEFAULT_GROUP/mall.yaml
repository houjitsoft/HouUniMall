server:
  port: 8220

# mall 只有 bootstrap.yml、不 import mutual.yaml，JWT 密钥必须在本文件单独声明，
# 否则后台带着 auth 签发的 token 调 mall 接口会被判签名不匹配。
jwt:
  secret: ${AUTH_JWT_SECRET}

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}${MYSQL_PARAMS}
    username: ${MYSQL_USER}
    password: ${MALL_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 300000
      pool-name: MallHikariCP
      max-lifetime: 600000
      keepalive-time: 30000
      connection-test-query: SELECT 1
      connection-init-sql: SELECT 1
  main:
    allow-bean-definition-overriding: true

# 商城核心服务的插件宿主能力：集中装载商城域插件（优惠券/积分商城/抽奖/满赠/
# 拼团/红包/商品折扣/秒杀）。mall 是插件宿主之一，不承担全部插件的装载。
# 注意：Nacos 配置优先级高于容器 env，改这里比改 compose 环境变量更可靠。
houcloud:
  plugin:
    host-service: mall
    boot-enabled: true
    plugins-dir: /app/plugins
