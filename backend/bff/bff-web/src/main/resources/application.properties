logging.level.com.houjiang.bffweb=DEBUG

# AI 智能体调用可能耗时 60-120 秒（长 JSON 输出 + 模型思考），
# 默认 readTimeout 60s 会让 BFF 先断开、服务端仍在算并写库，前端只看到超时。
# 只放宽 chat 相关的 aiagent 客户端，不全局放大，避免掩盖其他服务的真实超时。
#
# 2026-11-09：180s 仍不够。模型跑在老牛 X99 本机 Ollama（经 om.houjit.com 网关），
# 冷加载实测 125s、热态 73s、最坏 231s；AI 智能体一次正常回答 104-147s，
# 遇到模型被卸载后的首个请求就会撞上 180s 被 BFF 切断（现象=前端"AI 暂时没回应"）。
# 放宽到 330s 覆盖「冷加载 231s + 推理」的最坏组合；nginx 对应 location 已是 600s。
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=180000
# AiServiceFeign 的 contextId 是 ai，必须按 contextId 配才生效（优先级高于 default）
spring.cloud.openfeign.client.config.ai.connectTimeout=5000
spring.cloud.openfeign.client.config.ai.readTimeout=330000

# AI 流式对话（/web/ai/chat/stream）用 StreamingResponseBody 异步写出，
# 不显式声明就会落回 Tomcat 的 asyncTimeout 默认 30 秒，长文案刚生成一半就被断开。
spring.mvc.async.request-timeout=600000
